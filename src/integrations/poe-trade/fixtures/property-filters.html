<div class="filter filter-property">
    <span class="filter-body">
        <div class="filter-title">Quality</div>
        <input type="number" class="form-control minmax" placeholder="min" step="any" />
        <input type="number" class="form-control minmax" placeholder="max" step="any" />
    </span>
</div>
<div class="filter filter-property spaced">
    <span class="filter-body">
        <div class="filter-title">Vaal Gem</div>
        <div class="multiselect filter-select" tabindex="-1">
            <div class="multiselect__tags">
                <input type="text" placeholder="Any" class="multiselect__input" value="Any" />
            </div>
            <div class="multiselect__content-wrapper" style="display: none">
                <ul class="multiselect__content">
                    <li class="multiselect__element">
                        <span class="multiselect__option multiselect__option--selected"
                            ><span>Any</span></span
                        >
                    </li>
                    <li class="multiselect__element">
                        <span class="multiselect__option"><span>Yes</span></span>
                    </li>
                    <li class="multiselect__element">
                        <span class="multiselect__option"><span>No</span></span>
                    </li>
                </ul>
            </div>
        </div>
    </span>
</div>
